services:
  app:
    build: ./docker/php
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
      - memcached
    environment:
      DB_HOST: db
      DB_NAME: punto_pago
      DB_USER: root
      DB_PASS: secret
      MEMCACHED_HOST: memcached
      WEBHOOK_SECRET: super-secret-key-123

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: punto_pago
    ports:
      - "3306:3306"
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d
      - db_data:/var/lib/mysql

  memcached:
    image: memcached:1.6-alpine
    ports:
      - "11211:11211"

volumes:
  db_data: